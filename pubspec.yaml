name: routiner
description: "A new Flutter project."

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.7
  flutter_screenutil: ^5.9.3
  go_router: ^17.1.0
  flutter_svg: ^2.2.4
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.2.0
  shared_preferences: ^2.2.2
  badges: ^3.1.2
  intl: ^0.20.2
  image_picker: ^1.1.2
  firebase_storage: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter_native_splash:
  android: true 
  ios: false
  fullscreen: true
  image: assets/images/logo.png
  color: "#3843FF"  

flutter:
  generate: true
  uses-material-design: true

  assets:
   - assets/images/
   - assets/images/onboarding/
   - assets/icons/
   - assets/json/lang/
